[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dfc-kit"
version = "0.27.0"
description = "Censor-aware tools for dynamic functional connectivity analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
  "functional connectivity",
  "dynamic functional connectivity",
  "fMRI",
  "neuroimaging",
  "XCP-D",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "numpy>=1.23",
]

[project.urls]
Homepage = "https://github.com/yidao9518/dfc-kit"
Repository = "https://github.com/yidao9518/dfc-kit"
Issues = "https://github.com/yidao9518/dfc-kit/issues"

[project.scripts]
dfc-kit = "dfckit.cli:main"

[project.optional-dependencies]
states = [
  "scikit-learn>=1.2",
]
phase = [
  "scipy>=1.10",
]
qc = [
  "scipy>=1.10",
]
hmm = [
  "hmmlearn>=0.3",
  "scikit-learn>=1.2",
]
information = [
  "scipy>=1.10",
]
all = [
  "hmmlearn>=0.3",
  "scikit-learn>=1.2",
  "scipy>=1.10",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.6",
  "twine>=5",
]
docs = [
  "mkdocs>=1.6,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
